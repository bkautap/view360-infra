---
- name: Mappen voor Odoo aanmaken
  ansible.builtin.file:
    path: "{{ base_dir }}/odoo/{{ item.name }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { name: config, mode: "0750" }
    # Addons zijn geen geheimen; de odoo-gebruiker in de container moet de map kunnen lezen
    - { name: addons, mode: "0755" }

# odoo.conf bevat het admin-wachtwoord. Tijdelijk 0644 omdat de uid van de
# odoo-gebruiker in de image niet bevestigd is. Zet na verificatie
# (docker run --rm --entrypoint id odoo:<versie> odoo) owner op die uid en mode op 0400.
- name: odoo.conf renderen
  ansible.builtin.template:
    src: odoo.conf.j2
    dest: "{{ base_dir }}/odoo/config/odoo.conf"
    owner: root
    group: root
    mode: "0644"

- name: Build-map voor de eigen Odoo-image
  ansible.builtin.file:
    path: "{{ base_dir }}/odoo/build"
    state: directory
    mode: "0755"

- name: Dockerfile renderen
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ base_dir }}/odoo/build/Dockerfile"
    mode: "0644"
  register: odoo_dockerfile

- name: Eigen Odoo-image opnieuw bouwen bij wijziging
  ansible.builtin.command: "docker compose --project-directory {{ base_dir }}/odoo build odoo"
  when: odoo_dockerfile.changed
  changed_when: true

- name: Odoo docker-compose renderen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ base_dir }}/odoo/docker-compose.yml"
    mode: "0600"

- name: Odoo stack starten
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_stack
  vars:
    stack_name: odoo
