---
- name: Mappen voor Flowable aanmaken
  ansible.builtin.file:
    path: "{{ base_dir }}/flowable"
    state: directory
    mode: "0750"

- name: Flowable docker-compose renderen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ base_dir }}/flowable/docker-compose.yml"
    mode: "0600"

- name: Flowable stack starten
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_stack
  vars:
    stack_name: flowable
