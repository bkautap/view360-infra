---
- name: Mappen voor OpenProject aanmaken
  ansible.builtin.file:
    path: "{{ base_dir }}/openproject"
    state: directory
    mode: "0750"

- name: OpenProject docker-compose renderen
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ base_dir }}/openproject/docker-compose.yml"
    mode: "0600"

- name: OpenProject stack starten
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_stack
  vars:
    stack_name: openproject
