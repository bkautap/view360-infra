---
# Algemene instellingen. Geen geheimen hier: die staan in vault.yml.

domain: leadership3-0.com
acme_email: "apneef@bk-automatisering.nl"        # PAS AAN: voor Let's Encrypt-meldingen
base_dir: /opt/leadership3
proxy_network: proxy
verify_public_endpoints: false             # zet op true zodra DNS en TLS werken

# Hostnames
odoo_host: "{{ domain }}"
nextcloud_host: "dms.{{ domain }}"
openproject_host: "project.{{ domain }}"
flowable_host: "flow.{{ domain }}"
keycloak_host: "auth.{{ domain }}"
traefik_host: "traefik.{{ domain }}"

# Versies: gepind. Verifieer elke tag op Docker Hub / quay.io voor uitrol.
versions:
  traefik: "v3.6"
  socketproxy: "0.3"
  crowdsec: "v1.7.7"
  crowdsec_bouncer: "latest"               # fbonalair/traefik-crowdsec-bouncer (tag 1.0 bestaat niet; image onderhouden sinds ~2022)
  postgres: "17"
  redis: "7-alpine"
  odoo: "20.0"
  nextcloud: "32"                          # laatste major, verifieer
  keycloak: "26.4"
  openproject: "17"                        # slim-variant, verifieer tag
  flowable: "6.8.0"                        # flowable/flowable-ui (6.8.1 bestaat niet op Docker Hub)

# CrowdSec: actief alleen als de bouncer-sleutel in de vault staat
crowdsec_enabled: true
crowdsec_active: "{{ crowdsec_enabled and (vault_crowdsec_bouncer_key | default('') | length > 0) }}"

# Middlewares die op elke publieke route komen
route_middlewares: "secure-headers@file,rate-limit@file{{ ',crowdsec@file' if crowdsec_active else '' }}"

# Odoo
odoo_db_name: leadership3              # naam van de Odoo-database (dbfilter)
odoo_workers: 4                            # ~1 worker per vCPU, begin conservatief

# Nextcloud
nextcloud_admin_user: "nc-admin"

# Backups
backup_dir: /var/backups/leadership3
backup_retention_days: 14
backup_remote: ""                          # bijv. "backup@backuphost:/srv/backups/leadership3/"
backup_passphrase_file: /root/.backup-passphrase
backup_db_containers:
  - { container: odoo-odoo-db-1, user: odoo }
  - { container: nextcloud-nextcloud-db-1, user: nextcloud }
  - { container: openproject-openproject-db-1, user: openproject }
  - { container: keycloak-keycloak-db-1, user: keycloak }
  - { container: flowable-flowable-db-1, user: flowable }
backup_volumes:
  - odoo-data
  - nextcloud-app
  - openproject-assets
